<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lexis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07090d;--glass:rgba(255,255,255,0.04);--border:rgba(120,180,255,0.10);--border2:rgba(120,180,255,0.20);--blue-dim:rgba(80,150,255,0.15);--blue-glow:rgba(60,130,255,0.07);--text:rgba(210,230,255,0.90);--text2:rgba(150,185,230,0.60);--text3:rgba(100,145,200,0.40);--green-dim:rgba(50,200,140,0.10);--red-dim:rgba(240,90,90,0.10);--fs:16px}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;color:var(--text);font-size:var(--fs);max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.shell{background:var(--bg);min-height:100vh;position:relative;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.o1{width:300px;height:300px;top:-80px;right:-80px;background:radial-gradient(circle,rgba(60,120,255,0.13) 0%,transparent 65%)}
.o2{width:200px;height:200px;bottom:80px;left:-50px;background:radial-gradient(circle,rgba(40,100,220,0.08) 0%,transparent 65%)}
.inn{position:relative;z-index:1}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0;gap:8px}
.app-nm{font-size:calc(var(--fs)*0.65);font-weight:500;letter-spacing:0.16em;color:var(--text3);text-transform:uppercase}
.hstats{display:flex;gap:12px}
.hs{font-size:calc(var(--fs)*0.75);color:var(--text3)}.hs span{color:var(--text2);font-weight:500}
.fs-row{display:flex;align-items:center;gap:8px;padding:10px 18px 0}
.fs-a{font-size:calc(var(--fs)*0.78);color:var(--text3);flex-shrink:0;font-weight:500;user-select:none}
.fs-wrap{flex:1;position:relative;height:20px;display:flex;align-items:center}
.fs-track{width:100%;height:2px;background:rgba(120,180,255,0.15);border-radius:1px;position:relative;cursor:pointer}
.fs-fill{height:100%;background:rgba(100,180,255,0.45);border-radius:1px}
.fs-thumb{width:22px;height:22px;border-radius:50%;background:rgba(140,200,255,0.9);border:2px solid rgba(80,150,255,0.5);position:absolute;top:50%;transform:translate(-50%,-50%);cursor:grab;box-shadow:0 0 8px rgba(80,150,255,0.3);touch-action:none}
.fs-thumb:active{cursor:grabbing;transform:translate(-50%,-50%) scale(1.2)}
.fs-lbl{font-size:calc(var(--fs)*0.75);color:rgba(140,200,255,0.6);flex-shrink:0;min-width:32px;text-align:right}
.nav{display:flex;padding:12px 18px 0;border-bottom:0.5px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:50}
.nb{flex:1;padding:10px 2px;font-size:calc(var(--fs)*0.72);letter-spacing:0.06em;text-transform:uppercase;background:none;border:none;border-bottom:1.5px solid transparent;cursor:pointer;color:var(--text3);font-family:inherit;font-weight:500;transition:.2s}
.nb.active{color:rgba(140,200,255,0.9);border-bottom-color:rgba(90,150,255,0.5)}
.scr{display:none;padding:16px 18px 40px}.scr.active{display:block}
.slbl{font-size:calc(var(--fs)*0.70);letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;font-weight:500}
.gc{background:var(--glass);border:0.5px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px}
.ov{position:fixed;inset:0;background:rgba(7,9,13,0.93);z-index:200;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.dp{width:100%;max-width:480px;background:#0d1420;border:0.5px solid var(--border2);border-radius:20px 20px 0 0;padding:24px 22px 44px;position:relative;max-height:88vh;overflow-y:auto}
.dh{width:36px;height:3px;background:var(--border2);border-radius:2px;margin:0 auto 20px}
.dc{position:absolute;top:18px;right:18px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:calc(var(--fs)*1.1);font-family:inherit;padding:4px 8px}
.d-term{font-size:calc(var(--fs)*1.6);font-weight:500;color:var(--text);margin-bottom:8px;line-height:1.3}
.d-zh{font-size:calc(var(--fs)*1.05);color:rgba(140,200,255,0.85);line-height:1.6;margin-bottom:10px}
.d-ex{font-size:calc(var(--fs)*0.95);color:var(--text2);font-style:italic;line-height:1.7;border-left:2px solid rgba(80,150,255,0.22);padding-left:12px;margin-bottom:12px}
.d-note{font-size:calc(var(--fs)*0.9);color:var(--text3);background:var(--blue-dim);border:0.5px solid var(--border2);border-radius:10px;padding:9px 12px;margin-bottom:14px;line-height:1.6}
.d-mtrack{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.d-mfill{height:100%;background:rgba(100,180,255,0.5);border-radius:2px}
.del-btn{width:100%;padding:14px;background:rgba(240,90,90,0.08);border:0.5px solid rgba(240,90,90,0.2);border-radius:12px;color:rgba(240,110,110,0.7);font-size:calc(var(--fs)*0.85);letter-spacing:0.08em;text-transform:uppercase;font-weight:500;cursor:pointer;font-family:inherit}
.badge{font-size:calc(var(--fs)*0.72);letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border-radius:20px;font-weight:500}
.bi{background:rgba(140,100,255,0.12);color:rgba(180,150,255,0.75);border:0.5px solid rgba(140,100,255,0.2)}
.bp{background:rgba(60,130,255,0.12);color:rgba(110,175,255,0.75);border:0.5px solid rgba(60,130,255,0.2)}
.bw{background:rgba(40,190,140,0.10);color:rgba(80,210,165,0.75);border:0.5px solid rgba(40,190,140,0.18)}
.bs{background:rgba(220,130,50,0.10);color:rgba(240,165,75,0.75);border:0.5px solid rgba(220,130,50,0.18)}
.frail{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.frail::-webkit-scrollbar{display:none}
.fol{flex-shrink:0;width:82px;height:100px;border-radius:14px;border:0.5px solid var(--border);background:var(--glass);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px 6px;position:relative;transition:.2s;-webkit-tap-highlight-color:transparent}
.fol.sel{background:var(--blue-dim);border-color:var(--border2)}
.fol-ic{font-size:calc(var(--fs)*1.3);color:var(--text3);margin-bottom:6px}
.fol.sel .fol-ic{color:rgba(140,200,255,0.85)}
.fol-nm{font-size:calc(var(--fs)*0.68);letter-spacing:0.06em;text-transform:uppercase;color:var(--text3);text-align:center;font-weight:500}
.fol.sel .fol-nm{color:rgba(160,215,255,0.9)}
.fol-ct{position:absolute;top:7px;right:8px;font-size:calc(var(--fs)*0.72);color:var(--text3);font-weight:500}
.fol.sel .fol-ct{color:rgba(140,200,255,0.7)}
.wrow{display:flex;align-items:center;gap:10px;padding:14px;background:var(--glass);border:0.5px solid var(--border);border-radius:14px;cursor:pointer;transition:.15s;margin-bottom:8px;-webkit-tap-highlight-color:transparent}
.wrow:active{background:rgba(80,150,255,0.07)}
.wen{font-size:calc(var(--fs)*1.0);font-weight:500;color:var(--text)}
.wzh{font-size:calc(var(--fs)*0.88);color:var(--text2);margin-top:3px}
.wnote{font-size:calc(var(--fs)*0.78);color:var(--text3);margin-top:3px;font-style:italic}
.mdots{display:flex;gap:3px;margin-top:6px}
.md{width:5px;height:5px;border-radius:50%;background:rgba(80,150,255,0.15)}
.md.on{background:rgba(100,180,255,0.55)}
.card-area{position:relative;height:300px;margin-bottom:18px;display:flex;align-items:center;justify-content:center}
.fc{width:100%;height:280px;position:absolute;border-radius:20px;border:0.5px solid var(--border2);background:#0d1624;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;text-align:center;user-select:none;transition:transform .15s,opacity .15s;-webkit-tap-highlight-color:transparent}
.fc.main{z-index:3}.fc.b1{transform:translateX(6px) scale(0.96);opacity:0.35;pointer-events:none;z-index:2}.fc.b2{transform:translateX(10px) scale(0.92);opacity:0.15;pointer-events:none;z-index:1}
.fc.exl{transform:translateX(-140%) rotate(-12deg);opacity:0;transition:transform .32s,opacity .22s;pointer-events:none}
.fc.exr{transform:translateX(140%) rotate(12deg);opacity:0;transition:transform .32s,opacity .22s;pointer-events:none}
.fc-type{font-size:calc(var(--fs)*0.75);letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:16px}
.fc-word{font-size:calc(var(--fs)*1.75);font-weight:500;color:var(--text);margin-bottom:8px;line-height:1.2}
.fc-tap{font-size:calc(var(--fs)*0.78);color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;margin-top:18px}
.fc-zh{font-size:calc(var(--fs)*1.25);font-weight:500;color:rgba(140,200,255,0.9);margin-bottom:10px;line-height:1.5}
.fc-ex{font-size:calc(var(--fs)*0.88);color:var(--text2);font-style:italic;line-height:1.6;margin-top:8px}
.fc-note{font-size:calc(var(--fs)*0.8);color:var(--text3);margin-top:6px}
.card-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.cb{padding:14px 6px;border-radius:13px;border:0.5px solid var(--border);background:var(--glass);font-size:calc(var(--fs)*0.85);letter-spacing:0.04em;text-transform:uppercase;font-weight:500;cursor:pointer;font-family:inherit;text-align:center;-webkit-tap-highlight-color:transparent}
.cb-no{color:rgba(240,110,110,0.75);border-color:rgba(240,90,90,0.18);background:var(--red-dim)}
.cb-skip{color:var(--text3)}
.cb-yes{color:rgba(60,210,140,0.85);border-color:rgba(40,190,140,0.25);background:var(--green-dim)}
.swipe-hint{font-size:calc(var(--fs)*0.78);color:var(--text3);text-align:center}
.prog-bar{height:2px;background:var(--border);border-radius:1px;margin-bottom:12px}
.prog-fill{height:100%;background:rgba(100,180,255,0.45);border-radius:1px;transition:.3s}
.qctr{font-size:calc(var(--fs)*0.78);letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);text-align:right;margin-bottom:10px}
.qcard{background:var(--glass);border:0.5px solid var(--border);border-radius:16px;padding:20px;margin-bottom:12px}
.qlbl{font-size:calc(var(--fs)*0.78);letter-spacing:0.10em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.qword{font-size:calc(var(--fs)*1.5);font-weight:500;color:var(--text);text-align:center;margin:10px 0 4px;line-height:1.3}
.opts6{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:14px 10px;background:var(--glass);border:0.5px solid var(--border);border-radius:12px;color:var(--text2);font-size:calc(var(--fs)*0.88);cursor:pointer;text-align:center;font-family:inherit;line-height:1.5;word-break:break-word;-webkit-tap-highlight-color:transparent}
.opt:active{background:var(--blue-glow)}
.opt.ok{background:rgba(40,190,140,0.14);border-color:rgba(40,190,140,0.35);color:rgba(60,215,150,0.95);font-weight:500}
.opt.no{background:rgba(240,90,90,0.09);border-color:rgba(240,90,90,0.28);color:rgba(240,110,110,0.9)}
.fb{border-radius:11px;padding:12px 14px;margin:10px 0;font-size:calc(var(--fs)*0.9);line-height:1.6}
.fb-ok{background:rgba(40,190,140,0.09);border:0.5px solid rgba(40,190,140,0.22);color:rgba(60,215,150,0.9)}
.fb-no{background:rgba(240,90,90,0.07);border:0.5px solid rgba(240,90,90,0.18);color:rgba(240,110,110,0.9)}
.af label{font-size:calc(var(--fs)*0.78);letter-spacing:0.10em;text-transform:uppercase;color:var(--text3);display:block;margin-bottom:5px;margin-top:12px}
.af label:first-child{margin-top:0}
.af input,.af textarea,.af select{width:100%;background:rgba(255,255,255,0.04);border:0.5px solid var(--border);border-radius:11px;padding:12px 14px;font-size:calc(var(--fs)*0.95);color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
.af input:focus,.af textarea:focus{border-color:var(--border2)}
.af select{color:rgba(160,215,255,0.75)}
.af select option{background:#0d1420;color:rgba(200,225,255,0.85)}
.af textarea{min-height:70px;resize:vertical}
.fb-g{background:rgba(40,190,140,0.09);border:0.5px solid rgba(40,190,140,0.2);border-radius:10px;padding:12px 14px;font-size:calc(var(--fs)*0.9);color:rgba(60,215,150,0.9);margin-top:10px}
.fb-r{background:rgba(240,90,90,0.07);border:0.5px solid rgba(240,90,90,0.18);border-radius:10px;padding:12px 14px;font-size:calc(var(--fs)*0.9);color:rgba(240,110,110,0.9);margin-top:10px}
.sbtn{width:100%;padding:14px;background:var(--blue-dim);border:0.5px solid var(--border2);border-radius:13px;color:rgba(160,215,255,0.9);font-size:calc(var(--fs)*0.88);letter-spacing:0.10em;text-transform:uppercase;font-weight:500;cursor:pointer;font-family:inherit;margin-top:4px;-webkit-tap-highlight-color:transparent}
.sbtn:active{background:rgba(80,150,255,0.22)}
.gbtn{width:100%;padding:12px;background:none;border:0.5px solid var(--border);border-radius:12px;color:var(--text3);font-size:calc(var(--fs)*0.82);letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;font-family:inherit;margin-top:8px;-webkit-tap-highlight-color:transparent}
.nbtn{width:100%;padding:13px;background:var(--blue-dim);border:0.5px solid var(--border2);border-radius:12px;color:rgba(160,215,255,0.9);font-size:calc(var(--fs)*0.82);letter-spacing:0.10em;text-transform:uppercase;font-weight:500;cursor:pointer;font-family:inherit;margin-top:9px;-webkit-tap-highlight-color:transparent}
.sg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px}
.sc{background:var(--glass);border:0.5px solid var(--border);border-radius:12px;padding:12px 7px;text-align:center}
.scn{font-size:calc(var(--fs)*1.3);font-weight:500;color:rgba(160,215,255,0.85)}
.scl{font-size:calc(var(--fs)*0.70);letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-top:3px}
.fps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fp{padding:7px 14px;font-size:calc(var(--fs)*0.82);background:var(--glass);border:0.5px solid var(--border);border-radius:20px;color:var(--text3);cursor:pointer;font-family:inherit;letter-spacing:0.04em;text-transform:uppercase;font-weight:500;-webkit-tap-highlight-color:transparent}
.fp.sel{background:var(--blue-dim);border-color:var(--border2);color:rgba(160,215,255,0.9)}
.score-big{font-size:calc(var(--fs)*3.2);font-weight:500;text-align:center;letter-spacing:-1px;margin-bottom:4px}
.score-sub{font-size:calc(var(--fs)*0.82);letter-spacing:0.10em;text-transform:uppercase;color:var(--text3);text-align:center;margin-bottom:18px}
.sh{color:rgba(50,210,140,0.9)}.sm{color:rgba(240,175,60,0.9)}.sl{color:rgba(240,95,95,0.9)}
.ibar{background:var(--blue-glow);border:0.5px solid var(--border2);border-radius:13px;padding:14px 16px;margin-bottom:13px;display:flex;align-items:center;gap:10px}
.ibar p{flex:1;font-size:calc(var(--fs)*0.88);color:rgba(150,190,240,0.7);line-height:1.5}
.ibar strong{color:rgba(180,220,255,0.9)}
.ibar button{flex-shrink:0;padding:9px 14px;background:var(--blue-dim);border:0.5px solid var(--border2);border-radius:9px;color:rgba(160,215,255,0.9);font-size:calc(var(--fs)*0.82);cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap}
</style>
</head>
<body>
<div class="shell">
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="ov" id="ov"><div class="dp"><div class="dh"></div><button class="dc" onclick="closeD()">✕</button><div id="dc"></div></div></div>
  <div class="inn">
    <div class="topbar">
      <div class="app-nm">Lexis</div>
      <div class="hstats"><div class="hs">詞庫 <span id="ht">0</span></div><div class="hs">正確率 <span id="hr">—</span></div></div>
    </div>
    <div class="fs-row">
      <span class="fs-a">A</span>
      <div class="fs-wrap"><div class="fs-track" id="fs-track"><div class="fs-fill" id="fs-fill"></div><div class="fs-thumb" id="fs-thumb"></div></div></div>
      <span class="fs-a" style="font-size:calc(var(--fs)*1.2)">A</span>
      <span class="fs-lbl" id="fs-lbl">16px</span>
    </div>
    <div class="nav">
      <button class="nb active" onclick="go('cards')">單字卡</button>
      <button class="nb" onclick="go('quiz')">測驗</button>
      <button class="nb" onclick="go('library')">詞庫</button>
      <button class="nb" onclick="go('add')">新增</button>
      <button class="nb" onclick="go('export')">匯出</button>
    </div>

    <div id="scr-cards" class="scr active">
      <div id="ibar"></div>
      <div id="cs-setup">
        <div class="sg">
          <div class="sc"><div class="scn" id="cs-t">0</div><div class="scl">詞庫</div></div>
          <div class="sc"><div class="scn" id="cs-s">0</div><div class="scl">已看</div></div>
          <div class="sc"><div class="scn" id="cs-l">0</div><div class="scl">剩餘</div></div>
        </div>
        <div class="slbl">範圍</div>
        <div class="fps">
          <button class="fp sel" id="cf-all" onclick="setCF('all')">全部</button>
          <button class="fp" id="cf-idiom" onclick="setCF('idiom')">慣用語</button>
          <button class="fp" id="cf-phrase" onclick="setCF('phrase')">片語</button>
          <button class="fp" id="cf-word" onclick="setCF('word')">單字</button>
        </div>
        <button class="sbtn" onclick="startCards()">開始記憶</button>
      </div>
      <div id="cs-active" style="display:none">
        <p style="font-size:calc(var(--fs)*0.82);letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);text-align:center;margin-bottom:12px" id="cprog"></p>
        <div class="card-area" id="carea"></div>
        <div class="card-btns">
          <button class="cb cb-no" onclick="cAns(false)">✕ 不熟</button>
          <button class="cb cb-skip" onclick="cSkip()">跳過</button>
          <button class="cb cb-yes" onclick="cAns(true)">✓ 記住</button>
        </div>
        <p class="swipe-hint" style="margin-top:10px">點擊翻面 · 左滑不熟 · 右滑記住</p>
        <button class="gbtn" style="margin-top:14px" onclick="endCards()">結束本次</button>
      </div>
      <div id="cs-result" style="display:none"></div>
    </div>

    <div id="scr-quiz" class="scr">
      <div id="qs-setup">
        <div class="sg">
          <div class="sc"><div class="scn" id="qt">0</div><div class="scl">詞庫</div></div>
          <div class="sc"><div class="scn" id="qp">0</div><div class="scl">範圍</div></div>
          <div class="sc"><div class="scn" id="qtype-lbl">英→中</div><div class="scl">題型</div></div>
        </div>
        <div class="slbl">題型</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
          <button class="fp sel" id="qt-em" onclick="setQT('em')">英→中</button>
          <button class="fp" id="qt-me" onclick="setQT('me')">中→英</button>
          <button class="fp" id="qt-mix" onclick="setQT('mix')">混合</button>
        </div>
        <div class="slbl">範圍</div>
        <div class="fps">
          <button class="fp sel" id="qf-all" onclick="setQF('all')">全部</button>
          <button class="fp" id="qf-idiom" onclick="setQF('idiom')">慣用語</button>
          <button class="fp" id="qf-phrase" onclick="setQF('phrase')">片語</button>
          <button class="fp" id="qf-word" onclick="setQF('word')">單字</button>
        </div>
        <button class="sbtn" style="margin-top:14px" onclick="startQuiz()">開始測驗</button>
      </div>
      <div id="qs-active" style="display:none">
        <div class="prog-bar"><div class="prog-fill" id="qprog"></div></div>
        <div class="qctr" id="qctr"></div>
        <div class="qcard" id="qcard"></div>
        <div class="opts6" id="qopts"></div>
        <div id="qfb"></div>
        <button class="nbtn" id="qnext" style="display:none" onclick="nextQ()">下一題 →</button>
        <button class="gbtn" onclick="endQuiz()">結束測驗</button>
      </div>

function load(){try{const d=localStorage.getItem(SK);if(d){const p=JSON.parse(d);S.words=p.words||[];S.fontSize=p.fontSize||16;}else S.words=[];}catch(e){S.words=[];}applyFS();}
function save(){try{localStorage.setItem(SK,JSON.stringify({words:S.words,fontSize:S.fontSize}));}catch(e){}}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function bC(t){return{idiom:'bi',phrase:'bp',word:'bw',slang:'bs'}[t]||'bw';}
function bL(t){return{idiom:'慣用語',phrase:'片語',word:'單字',slang:'俚語'}[t]||t;}
function shuf(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function updH(){const tot=S.words.reduce((a,w)=>a+w.correct+w.wrong,0),cor=S.words.reduce((a,w)=>a+w.correct,0);document.getElementById('ht').textContent=S.words.length;document.getElementById('hr').textContent=tot?Math.round(cor/tot*100)+'%':'—';}
function updFC(){const c={all:S.words.length,idiom:0,phrase:0,word:0,slang:0};S.words.forEach(w=>{if(c[w.type]!==undefined)c[w.type]++;});['all','idiom','phrase','word','slang'].forEach(k=>{const el=document.getElementById('fc-'+k);if(el)el.textContent=c[k];});}
function applyFS(){document.documentElement.style.setProperty('--fs',S.fontSize+'px');document.getElementById('fs-lbl').textContent=S.fontSize+'px';const pct=(S.fontSize-FS_MIN)/(FS_MAX-FS_MIN)*100;document.getElementById('fs-fill').style.width=pct+'%';document.getElementById('fs-thumb').style.left=pct+'%';}
function initSlider(){
  const track=document.getElementById('fs-track'),thumb=document.getElementById('fs-thumb');
  function setX(x){const r=track.getBoundingClientRect(),pct=Math.max(0,Math.min(1,(x-r.left)/r.width));S.fontSize=Math.round(FS_MIN+pct*(FS_MAX-FS_MIN));applyFS();save();}
  thumb.addEventListener('mousedown',e=>{e.preventDefault();const mv=e2=>setX(e2.clientX);const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
  thumb.addEventListener('touchstart',e=>{e.preventDefault();const mv=e2=>{if(e2.touches[0])setX(e2.touches[0].clientX);};const up=()=>{document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',up);};document.addEventListener('touchmove',mv,{passive:false});document.addEventListener('touchend',up);},{passive:false});
  track.addEventListener('click',e=>{if(e.target!==thumb)setX(e.clientX);});
}
function checkImport(){const ex=new Set(S.words.map(w=>w.term.toLowerCase()));const n=IMP.filter(w=>!ex.has(w.term.toLowerCase())).length;const el=document.getElementById('ibar');if(n>0)el.innerHTML=`<div class="ibar"><p>尚有 <strong>${n} 個單字</strong>未匯入</p><button onclick="doImport(this)">一鍵匯入</button></div>`;else el.innerHTML='';}
function doImport(btn){btn.disabled=true;btn.textContent='匯入中…';const ex=new Set(S.words.map(w=>w.term.toLowerCase()));const toAdd=IMP.filter(w=>!ex.has(w.term.toLowerCase())).map((w,i)=>({...w,id:'v2_'+Date.now()+'_'+i,correct:0,wrong:0}));S.words=[...toAdd,...S.words];save();updH();updFC();document.getElementById('ibar').innerHTML=`<div class="ibar"><p>✓ 已匯入 <strong>${toAdd.length}</strong> 個單字！</p></div>`;setTimeout(()=>document.getElementById('ibar').innerHTML='',2500);}
function go(t){document.querySelectorAll('.nb').forEach((b,i)=>b.classList.toggle('active',['cards','quiz','library','add','export'][i]===t));document.querySelectorAll('.scr').forEach(s=>s.classList.remove('active'));document.getElementById('scr-'+t).classList.add('active');if(t==='library'){updFC();renderLib();}if(t==='quiz')renderQSetup();if(t==='cards')renderCSetup();if(t==='export'){const ec=document.getElementById('exp-count');if(ec)ec.textContent=S.words.length;}}
function openD(id){const w=S.words.find(x=>x.id===id);if(!w)return;const tot=w.correct+w.wrong,pct=tot?Math.round(w.correct/tot*100):0;document.getElementById('dc').innerHTML=`<div style="margin-bottom:10px"><span class="badge ${bC(w.type)}">${bL(w.type)}</span></div><div class="d-term">${esc(w.term)}</div><div class="d-zh">${esc(w.meaning)}</div>${w.example?`<div class="d-ex">${esc(w.example)}</div>`:''} ${w.note?`<div class="d-note">${esc(w.note)}</div>`:''}<div style="font-size:calc(var(--fs)*0.75);letter-spacing:0.10em;text-transform:uppercase;color:var(--text3);margin-bottom:6px">掌握度</div><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><div class="d-mtrack"><div class="d-mfill" style="width:${pct}%"></div></div><span style="font-size:calc(var(--fs)*0.82);color:var(--text3);min-width:36px;text-align:right">${tot?pct+'%':'—'}</span></div><p style="font-size:calc(var(--fs)*0.82);color:var(--text3);margin-bottom:18px">${tot?`答對 ${w.correct}，答錯 ${w.wrong}`:'尚未測驗'}</p><button class="del-btn" onclick="delW('${w.id}')">刪除此詞彙</button>`;document.getElementById('ov').classList.add('show');}
function closeD(){document.getElementById('ov').classList.remove('show');}
function delW(id){if(!confirm('確定刪除？'))return;S.words=S.words.filter(w=>w.id!==id);save();updH();updFC();renderLib();closeD();}
function setLF(f){S.lF=f;document.querySelectorAll('.fol').forEach(el=>el.classList.toggle('sel',el.dataset.f===f));renderLib();}
function renderLib(){const q=(document.getElementById('lsrch')||{}).value||'';const list=S.words.filter(w=>(S.lF==='all'||w.type===S.lF)&&(!q||w.term.toLowerCase().includes(q.toLowerCase())||w.meaning.includes(q)));const el=document.getElementById('llist');if(!list.length){el.innerHTML=`<div style="text-align:center;padding:40px 0"><p style="color:var(--text3)">無符合項目</p></div>`;return;}el.innerHTML=list.map(w=>{const tot=w.correct+w.wrong,pct=tot?Math.round(w.correct/tot*100):0;const dots=Array.from({length:5},(_,i)=>`<div class="md${i<Math.round(pct/20)?' on':''}"></div>`).join('');return`<div class="wrow" onclick="openD('${w.id}')"><div style="flex:1;min-width:0"><div class="wen">${esc(w.term)}</div><div class="wzh">${esc(w.meaning)}</div>${w.note?`<div class="wnote">${esc(w.note)}</div>`:''}<div class="mdots">${dots}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0"><span class="badge ${bC(w.type)}">${bL(w.type)}</span><span style="color:var(--text3)">›</span></div></div>`;}).join('');}
let cFlip=false,tSX=0;
function setCF(f){S.cF=f;['all','idiom','phrase','word'].forEach(k=>{const el=document.getElementById('cf-'+k);if(el)el.classList.toggle('sel',k===f);});renderCSetup();}
function renderCSetup(){const pool=S.words.filter(w=>S.cF==='all'||w.type===S.cF);document.getElementById('cs-t').textContent=S.words.length;document.getElementById('cs-s').textContent=S.cards?S.cards.seen:0;document.getElementById('cs-l').textContent=pool.length;document.getElementById('cs-setup').style.display='';document.getElementById('cs-active').style.display='none';document.getElementById('cs-result').style.display='none';}
function startCards(){const pool=shuf(S.words.filter(w=>S.cF==='all'||w.type===S.cF));if(!pool.length){alert('詞庫是空的！');return;}S.cards={pool,idx:0,seen:0,known:0,unknown:0};document.getElementById('cs-setup').style.display='none';document.getElementById('cs-active').style.display='';document.getElementById('cs-result').style.display='none';showCard();}
function showCard(){cFlip=false;const{pool,idx}=S.cards;document.getElementById('cprog').textContent=`${idx+1} / ${pool.length}`;const area=document.getElementById('carea');area.innerHTML='';const defs=[{w:pool[idx],cls:'main'},{w:pool[idx+1],cls:'b1'},{w:pool[idx+2],cls:'b2'}];[...defs].reverse().forEach(({w,cls})=>{if(!w)return;const card=document.createElement('div');card.className=`fc ${cls}`;if(cls==='main'){card.innerHTML=`<div class="fc-type">${bL(w.type)}</div><div class="fc-word">${esc(w.term)}</div><div class="fc-tap">點擊翻面</div>`;card.addEventListener('click',flipCard);card.addEventListener('touchstart',e=>{tSX=e.touches[0].clientX;},{passive:true});card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tSX;if(Math.abs(dx)>50)cAns(dx>0);else if(Math.abs(dx)<10)flipCard();},{passive:true});}else{card.innerHTML=`<div class="fc-type">${bL(w.type)}</div><div class="fc-word" style="font-size:calc(var(--fs)*1.4)">${esc(w.term)}</div>`;}area.appendChild(card);});}
function flipCard(){const m=document.querySelector('.fc.main');if(!m||cFlip)return;cFlip=true;const w=S.cards.pool[S.cards.idx];m.innerHTML=`<div class="fc-type">${bL(w.type)}</div><div class="fc-zh">${esc(w.meaning)}</div>${w.example?`<div class="fc-ex">${esc(w.example)}</div>`:''}<div class="fc-note">${esc(w.note||'')}</div>`;}
function cAns(known){const m=document.querySelector('.fc.main');if(!m)return;const w=S.cards.pool[S.cards.idx];if(known){w.correct++;S.cards.known++;}else{w.wrong++;S.cards.unknown++;}S.cards.seen++;save();m.classList.add(known?'exr':'exl');setTimeout(()=>{S.cards.idx++;if(S.cards.idx>=S.cards.pool.length){endCards();return;}showCard();},320);}
function cSkip(){const m=document.querySelector('.fc.main');if(!m)return;m.classList.add('exl');setTimeout(()=>{S.cards.idx++;if(S.cards.idx>=S.cards.pool.length){endCards();return;}showCard();},320);}
function endCards(){document.getElementById('cs-active').style.display='none';document.getElementById('cs-result').style.display='';const{known,unknown,seen}=S.cards,pct=seen?Math.round(known/seen*100):0;const c=pct>=80?'sh':pct>=50?'sm':'sl';document.getElementById('cs-result').innerHTML=`<div class="gc" style="text-align:center;padding:30px 16px"><div class="score-big ${c}">${pct}%</div><div class="score-sub">記住 ${known}，不熟 ${unknown}</div><button class="sbtn" onclick="startCards()" style="margin-bottom:8px">再來一次</button><button class="gbtn" onclick="renderCSetup()">回到設定</button></div>`;}
function setQT(t){S.qType=t;['em','me','mix'].forEach(k=>{const el=document.getElementById('qt-'+k);if(el)el.classList.toggle('sel',k===t);});document.getElementById('qtype-lbl').textContent={em:'英→中',me:'中→英',mix:'混合'}[t];}
function setQF(f){S.qF=f;['all','idiom','phrase','word'].forEach(k=>{const el=document.getElementById('qf-'+k);if(el)el.classList.toggle('sel',k===f);});document.getElementById('qp').textContent=S.words.filter(w=>f==='all'||w.type===f).length;}
function renderQSetup(){document.getElementById('qt').textContent=S.words.length;document.getElementById('qp').textContent=S.words.filter(w=>S.qF==='all'||w.type===S.qF).length;document.getElementById('qs-setup').style.display='';document.getElementById('qs-active').style.display='none';document.getElementById('qs-result').style.display='none';}
function startQuiz(){const pool=shuf(S.words.filter(w=>S.qF==='all'||w.type===S.qF));if(pool.length<6){alert('至少需要 6 個單字才能出 6 個選項！');return;}S.quiz={pool,idx:0,correct:0,wrong:0};document.getElementById('qs-setup').style.display='none';document.getElementById('qs-active').style.display='';document.getElementById('qs-result').style.display='none';showQ();}
function showQ(){const{pool,idx}=S.quiz,w=pool[idx];document.getElementById('qprog').style.width=Math.round(idx/pool.length*100)+'%';document.getElementById('qctr').textContent=`${idx+1} / ${pool.length}`;document.getElementById('qnext').style.display='none';document.getElementById('qfb').innerHTML='';const isEM=S.qType==='em'?true:S.qType==='me'?false:Math.random()<0.5;S.quiz.isEM=isEM;if(isEM){document.getElementById('qcard').innerHTML=`<div class="qlbl">這個詞的中文意思是？</div><div class="qword">${esc(w.term)}</div>${w.note?`<div style="font-size:calc(var(--fs)*0.82);color:var(--text3);margin-top:6px;font-style:italic">${esc(w.note)}</div>`:''}`;S.quiz.answer=w.meaning;}else{document.getElementById('qcard').innerHTML=`<div class="qlbl">「${esc(w.meaning)}」的英文是？</div>`;S.quiz.answer=w.term;}const ca=S.quiz.answer;const others=shuf(S.words.filter(x=>x.id!==w.id)).slice(0,5);const opts=shuf([{t:ca,ok:true},...others.map(d=>({t:isEM?d.meaning:d.term,ok:false}))]);document.getElementById('qopts').innerHTML=opts.map((o,i)=>`<button class="opt" id="op${i}" onclick="chkO(${i},${o.ok},'${esc(ca).replace(/'/g,"\\'")}')">${esc(o.t)}</button>`).join('');}
function chkO(i,ok,ca){document.querySelectorAll('.opt').forEach(b=>b.style.pointerEvents='none');document.getElementById('op'+i).classList.add(ok?'ok':'no');if(!ok)document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===ca)b.classList.add('ok');});const w=S.quiz.pool[S.quiz.idx];if(ok)w.correct++;else w.wrong++;S.quiz[ok?'correct':'wrong']++;save();updH();const ex=w.example?`<br><em style="opacity:.8;font-size:calc(var(--fs)*0.85)">${esc(w.example)}</em>`:'';document.getElementById('qfb').innerHTML=`<div class="fb ${ok?'fb-ok':'fb-no'}">${ok?'✓ 正確！':`✗ 正確答案：${esc(ca)}`}${ex}</div>`;if(S.quiz.idx<S.quiz.pool.length-1)document.getElementById('qnext').style.display='';else setTimeout(endQuiz,1200);}
function nextQ(){S.quiz.idx++;showQ();}
function endQuiz(){const{correct,wrong}=S.quiz,total=correct+wrong,pct=total?Math.round(correct/total*100):0;const c=pct>=80?'sh':pct>=50?'sm':'sl';document.getElementById('qs-active').style.display='none';document.getElementById('qs-result').style.display='';document.getElementById('qs-result').innerHTML=`<div class="gc" style="text-align:center;padding:30px 16px"><div class="score-big ${c}">${pct}%</div><div class="score-sub">答對 ${correct}，答錯 ${wrong}</div><button class="sbtn" onclick="startQuiz()" style="margin-bottom:8px">再來一次</button><button class="gbtn" onclick="renderQSetup()">回到設定</button></div>`;}
function addWord(){const term=document.getElementById('ae').value.trim(),meaning=document.getElementById('am').value.trim();const example=document.getElementById('aex').value.trim(),note=document.getElementById('an').value.trim();const type=document.getElementById('at').value,fb=document.getElementById('afb');if(!term||!meaning){fb.innerHTML='<div class="fb-r">請填寫英文詞彙和中文意思</div>';return;}S.words.unshift({id:'w'+Date.now(),type,term,meaning,example,note,correct:0,wrong:0});save();['ae','am','aex','an'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});fb.innerHTML=`<div class="fb-g">✓ 已加入：${esc(term)}</div>`;updH();updFC();setTimeout(()=>{fb.innerHTML='';},2500);}

function exportTxt(){
  if(!S.words.length){alert('詞庫是空的！');return;}
  var types={idiom:'慣用語',phrase:'片語',word:'單字',slang:'俚語'};
  var lines=['Lexis 英文詞庫匯出 — '+new Date().toLocaleDateString('zh-TW'),'==================================================',''];
  ['idiom','phrase','word','slang'].forEach(function(type){
    var ws=S.words.filter(function(w){return w.type===type;});
    if(!ws.length)return;
    lines.push('['+types[type]+'] ('+ws.length+'\u500b)');
    lines.push('------------------------------');
    ws.forEach(function(w){
      lines.push('\u82f1\u6587\uff1a'+w.term);
      lines.push('\u4e2d\u6587\uff1a'+w.meaning);
      if(w.example)lines.push('\u4f8b\u53e5\uff1a'+w.example);
      if(w.note)lines.push('\u5099\u6ce8\uff1a'+w.note);
      var tot=w.correct+w.wrong;
      if(tot)lines.push('\u638c\u63e1\u5ea6\uff1a'+Math.round(w.correct/tot*100)+'% (\u7b54\u5c0d'+w.correct+'\uff0c\u7b54\u932f'+w.wrong+')');
      lines.push('');
    });
    lines.push('');
  });
  lines.push('\u5171 '+S.words.length+' \u500b\u8a5e\u5f59');
  var txt=lines.join('\n');
  var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Lexis_\u8a5e\u5eab_'+new Date().toISOString().slice(0,10)+'.txt';
  a.click();URL.revokeObjectURL(a.href);
  document.getElementById('exp-fb').innerHTML='<div class="fb-g">\u2713 TXT \u5df2\u5319\u51fa\uff01</div>';
  setTimeout(function(){document.getElementById('exp-fb').innerHTML='';},3000);
}

function exportExcel(){
  if(!S.words.length){alert('\u8a5e\u5eab\u662f\u7a7a\u7684\uff01');return;}
  var types={idiom:'\u6163\u7528\u8a9e',phrase:'\u7247\u8a9e',word:'\u55ae\u5b57',slang:'\u4fe3\u8a9e'};
  var rows=[['\u985e\u578b','\u82f1\u6587\u8a5e\u5f59','\u4e2d\u6587\u610f\u601d','\u4f8b\u53e5','\u7528\u6cd5\u5099\u6ce8','\u7b54\u5c0d\u6b21\u6578','\u7b54\u932f\u6b21\u6578','\u638c\u63e1\u5ea6%']];
  S.words.forEach(function(w){
    var tot=w.correct+w.wrong;
    rows.push([types[w.type]||w.type,w.term,w.meaning,w.example||'',w.note||'',w.correct,w.wrong,tot?Math.round(w.correct/tot*100):'']);
  });
  function csvCell(v){
    var s=String(v);
    if(s.indexOf(',')>=0||s.indexOf('"')>=0||s.indexOf('\n')>=0)return '"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  var csv='\ufeff'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Lexis_\u8a5e\u5eab_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();URL.revokeObjectURL(a.href);
  document.getElementById('exp-fb').innerHTML='<div class="fb-g">\u2713 Excel \u6a94\u6848\u5df2\u5319\u51fa\uff01<br><span style="font-size:calc(var(--fs)*0.82);opacity:.7">\u7528 Excel \u6216 Numbers \u958b\u555f .csv \u6a94\u6848\u5373\u53ef</span></div>';
  setTimeout(function(){document.getElementById('exp-fb').innerHTML='';},3000);
}

load();initSlider();updH();updFC();renderLib();checkImport();
</script>
