<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匯入記帳資料</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0e0e0e;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#1a1a1a;border-radius:12px;padding:28px 24px;max-width:360px;width:100%;margin:24px}
h2{font-size:18px;font-weight:500;margin-bottom:6px}
.sub{font-size:13px;color:#666;margin-bottom:24px;line-height:1.6}
.records{background:#0e0e0e;border-radius:8px;padding:12px;margin-bottom:20px;max-height:240px;overflow-y:auto}
.rec{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #222;font-size:12px;gap:8px}
.rec:last-child{border-bottom:none}
.rec-left{flex:1;min-width:0}
.rec-cat{color:#888;font-size:11px}
.rec-desc{color:#f0f0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-right{text-align:right;flex-shrink:0}
.rec-amt{color:#e05550;font-weight:500}
.rec-date{color:#555;font-size:11px}
.total{display:flex;justify-content:space-between;font-size:14px;color:#888;margin-bottom:20px;padding:0 2px}
.total span:last-child{color:#f0f0f0;font-weight:500}
.btn{width:100%;padding:14px;background:#f0f0f0;color:#0e0e0e;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer}
.btn:active{opacity:.85}
.btn.done{background:#3aa87a;color:#fff}
.msg{text-align:center;font-size:13px;color:#3aa87a;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <h2>匯入 2026年5月 資料</h2>
  <div class="sub">共 16 筆記錄，點下方按鈕匯入到記帳程式。<br>⚠️ 請在記帳程式的同一個瀏覽器開啟此頁。</div>
  <div class="records" id="rec-list"></div>
  <div class="total">
    <span>本月總支出</span>
    <span>$7,532</span>
  </div>
  <button class="btn" id="import-btn" onclick="doImport()">一鍵匯入</button>
  <div class="msg" id="msg">✓ 匯入成功！請回到記帳程式查看。</div>
</div>
<script>
const DATA = [
  {id:1746835200000,amount:894,category:"個人吃飯",desc:"全聯",date:"2026-05-10"},
  {id:1746835200001,amount:222,category:"個人吃飯",desc:"",date:"2026-05-10"},
  {id:1746835200002,amount:360,category:"個人吃飯",desc:"",date:"2026-05-09"},
  {id:1746835200003,amount:20,category:"個人吃飯",desc:"",date:"2026-05-08"},
  {id:1746835200004,amount:15,category:"個人吃飯",desc:"綠茶",date:"2026-05-08"},
  {id:1746835200005,amount:206,category:"個人吃飯",desc:"Uber晚餐",date:"2026-05-07"},
  {id:1746835200006,amount:540,category:"個人吃飯",desc:"全聯",date:"2026-05-07"},
  {id:1746835200007,amount:800,category:"汽車加油或保養",desc:"",date:"2026-05-08"},
  {id:1746835200008,amount:599,category:"遊戲",desc:"",date:"2026-05-10"},
  {id:1746835200009,amount:474,category:"遊戲",desc:"",date:"2026-05-09"},
  {id:1746835200010,amount:245,category:"遊戲",desc:"",date:"2026-05-07"},
  {id:1746835200011,amount:110,category:"社交",desc:"",date:"2026-05-08"},
  {id:1746835200012,amount:1551,category:"社交",desc:"",date:"2026-05-08"},
  {id:1746835200013,amount:230,category:"社交",desc:"Humble",date:"2026-05-07"},
  {id:1746835200014,amount:714,category:"寵物用品",desc:"貓砂",date:"2026-05-10"},
  {id:1746835200015,amount:552,category:"寵物用品",desc:"寵物罐頭",date:"2026-05-07"},
];

// 顯示預覽
const list = document.getElementById('rec-list');
list.innerHTML = DATA.map(r=>`
  <div class="rec">
    <div class="rec-left">
      <div class="rec-cat">${r.category}</div>
      <div class="rec-desc">${r.desc||'—'}</div>
    </div>
    <div class="rec-right">
      <div class="rec-amt">$${r.amount.toLocaleString()}</div>
      <div class="rec-date">${r.date}</div>
    </div>
  </div>`).join('');

function doImport(){
  try {
    const existing = JSON.parse(localStorage.getItem('dark_exp')||'[]');
    // 避免重複匯入（檢查 id）
    const existingIds = new Set(existing.map(r=>r.id));
    const toAdd = DATA.filter(r=>!existingIds.has(r.id));
    if(toAdd.length === 0){
      document.getElementById('msg').textContent = '⚠️ 資料已匯入過，無重複新增。';
      document.getElementById('msg').style.color = '#e8a030';
      document.getElementById('msg').style.display = 'block';
      return;
    }
    const merged = [...existing, ...toAdd].sort((a,b)=>b.date.localeCompare(a.date));
    localStorage.setItem('dark_exp', JSON.stringify(merged));
    const btn = document.getElementById('import-btn');
    btn.textContent = '✓ 匯入成功';
    btn.classList.add('done');
    btn.disabled = true;
    document.getElementById('msg').style.display = 'block';
  } catch(e) {
    alert('匯入失敗：' + e.message);
  }
}
</script>
</body>
</html>
